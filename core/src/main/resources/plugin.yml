name: PluginCategories
version: ${project.version}
main: com.thenamesali.plugincategories.PluginCategoriesPlugin
folia-supported: true
author: The Names Ali
website: https://github.com/seyedaliahmadirouein/Plugin-Categories
description: Organizes the /pl command output into clickable plugin categories, allowing authorized users to view installed plugins and their loading status.
commands:
  plugincategories:
    description: Opens the categorized plugin overview or reloads the configuration.
    aliases: [plcat]
permissions:
  plugincategories.use:
    description: Allows using the categorized plugin list.
    default: op
  plugincategories.admin:
    description: Allows reloading the Plugin Categories configuration.
    default: op
